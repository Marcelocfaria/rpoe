const sameTime=(last,eid,ini,fim)=>{const l=last.get(eid);return !!l&&l.some(x=>ov(x.ini,x.fim,ini,fim)>=30)};
function generate(date,rng,lastR){
  const used=new Set(),last=lastMap(lastR),vehicles=[];
  const days=e=>e.ultima?Math.max(0,dd(e.ultima,date)):200;
  S.cfgVeh.forEach(c=>{
    const slots=buildSlots(c),vis=slots.filter(s=>s.tipo==='visita');
    const cand=S.schools.filter(e=>e.ativa&&e.ra===c.ra&&!used.has(e.id));
    const asg=new Map();
    const ok=(e,s)=>s.ini<NIGHT||e.noite;
    cand.filter(e=>e.prioridade>0&&e.criticos&&e.criticos.length).sort((a,b)=>b.prioridade-a.prioridade||days(b)-days(a)).forEach(e=>{
      let best=null,bo=0;
      vis.forEach(s=>{if(asg.has(s)||!ok(e,s)||sameTime(last,e.id,s.ini,s.fim))return;
        const o=Math.max(...e.criticos.map(w=>ov(w.ini,w.fim,s.ini,s.fim)));if(o>bo){bo=o;best=s}});
      if(best&&bo>=20){asg.set(best,e);used.add(e.id)}
    });
    const order=[...vis.filter(s=>s.ini>=NIGHT),...vis.filter(s=>s.ini<NIGHT)];
    order.forEach(s=>{
      if(asg.has(s))return;
      const pool=cand.filter(e=>!used.has(e.id)&&ok(e,s));if(!pool.length)return;
      const sc=new Map(pool.map(e=>[e.id,days(e)+rng()*20+e.prioridade*8-(last.has(e.id)?(sameTime(last,e.id,s.ini,s.fim)?500:150):0)+(s.ini>=NIGHT&&e.noite?200:0)]));
      pool.sort((a,b)=>sc.get(b.id)-sc.get(a.id));
      asg.set(s,pool[0]);used.add(pool[0].id);
    });
    const items=[];let miss=0;
    slots.forEach(s=>{
      if(s.tipo==='refeicao')items.push({id:'i'+uid(),tipo:'refeicao',ini:s.ini,fim:s.fim,escolaId:null});
      else{const e=asg.get(s);if(e)items.push({id:'i'+uid(),tipo:'visita',ini:s.ini,fim:s.ini+(+e.dur||50),escolaId:e.id});else miss++}
    });
    vehicles.push({...clone(c),obs:obsText(c),items,faltou:miss,pool:cand.length});
  });
  return{date,vehicles};
}
function resolveRep(){
  const last=lastMap(S.archive[0]);let fixed=0,left=0;
  const used=new Set();S.draft.vehicles.forEach(v=>v.items.forEach(i=>i.escolaId&&used.add(i.escolaId)));
  const byId=id=>S.schools.find(e=>e.id===id);
  const fits=(eid,it)=>{const e=byId(eid);return e&&(it.ini<NIGHT||e.noite)&&!sameTime(last,eid,it.ini,it.fim)};
  S.draft.vehicles.forEach(v=>{
    const vis=v.items.filter(i=>i.tipo==='visita'&&i.escolaId);
    vis.forEach(it=>{
      if(!sameTime(last,it.escolaId,it.ini,it.fim))return;
      const sw=vis.find(o=>o!==it&&fits(o.escolaId,it)&&fits(it.escolaId,o));
      if(sw){[it.escolaId,sw.escolaId]=[sw.escolaId,it.escolaId];fixed++;return}
      const pool=S.schools.filter(e=>e.ativa&&e.ra===v.ra&&!used.has(e.id)&&fits(e.id,it)).sort((a,b)=>(a.ultima||'')<(b.ultima||'')?-1:1);
      if(pool.length){used.delete(it.escolaId);it.escolaId=pool[0].id;used.add(pool[0].id);fixed++}else left++;
    });
  });
  return{fixed,left};
}

/* ---------- avisos ---------- */
function computeWarn(draft,lastR){
  const last=lastMap(lastR),cnt=new Map(),byId=new Map(S.schools.map(e=>[e.id,e]));
  draft.vehicles.forEach(v=>v.items.forEach(i=>i.escolaId&&cnt.set(i.escolaId,(cnt.get(i.escolaId)||0)+1)));
  return draft.vehicles.map(v=>v.items.map((it,ii)=>{
    const w=[];
    if(it.tipo==='visita'){
      if(!it.escolaId)w.push(['err','Sem escola']);
      if(it.fim<=it.ini)w.push(['err','Horário final antes do início']);
      if(it.ini<tm(v.ini)||it.fim>tm(v.fim))w.push(['warn','Fora do turno da viatura']);
      if(v.items.some((o,oi)=>oi!==ii&&ov(o.ini,o.fim,it.ini,it.fim)>0))w.push(['err','Sobreposição de horários']);
      const e=byId.get(it.escolaId);
      if(e){
        if(cnt.get(e.id)>1)w.push(['err','Escola repetida no dia']);
        if(e.ra!==v.ra)w.push(['info','Escola de outra RA ('+e.ra+')']);
        if(it.ini>=NIGHT&&!e.noite)w.push(['warn','Escola sem turno noturno após 18H30']);
        if(!e.ativa)w.push(['warn','Escola inativa']);
        const l=last.get(e.id);
        if(l){const same=l.some(x=>ov(x.ini,x.fim,it.ini,it.fim)>=30);
          w.push([same?'err':'info',(same?'Repetiu da última escala no mesmo horário':'Repetiu da última escala, horário diferente')+' ('+l.map(x=>fh(x.ini)).join(', ')+')'])}
        if(e.prioridade>0&&e.criticos&&e.criticos.length&&!e.criticos.some(c=>ov(c.ini,c.fim,it.ini,it.fim)>0))w.push(['warn','Prioritária fora do horário crítico']);
        else if(e.prioridade>0&&e.criticos&&e.criticos.length)w.push(['ok','Horário crítico atendido']);
      }
    }else{
      if(v.items.some((o,oi)=>oi!==ii&&ov(o.ini,o.fim,it.ini,it.fim)>0))w.push(['err','Sobreposição de horários']);
    }
    return w;
  }));
}

    <div><div class="lbl" style="margin-bottom:4px">Horários críticos</div><div class="chips">
    ${PRESETS.map(p=>{const on=cr.some(c=>c.ini===tm(p.ini)&&c.fim===tm(p.fim));return `<button class="chip ${on?'on':'plain'}" data-a="togcrit" data-id="${e.id}" data-k="${esc(p.k)}" aria-pressed="${on}">${p.k} ${p.ini}–${p.fim}</button>`}).join('')}
    ${cr.filter(c=>!PRESETS.some(p=>tm(p.ini)===c.ini&&tm(p.fim)===c.fim)).map(c=>`<button class="chip on" data-a="rmcrit" data-id="${e.id}" data-ini="${c.ini}" data-fim="${c.fim}" title="Remover">${hh(c.ini)}–${hh(c.fim)} ×</button>`).join('')}
    </div></div>
    <div class="bar" style="border:0;padding:0">${fld('Outro horário',`<span class="times"><input type="time" id="ci${e.id}" value="08:00"> às <input type="time" id="cf${e.id}" value="09:00"></span>`)}<button class="btn sm" data-a="addcrit" data-id="${e.id}">Adicionar</button></div></div>`}).join('')+'</div>';
  return h;
}

function official(v,date){
  const rows=v.items.map(i=>`<div><span>${fh(i.ini)} ÀS ${fh(i.fim)}</span><span>${i.tipo==='refeicao'?'REFEIÇÃO':esc(nome(i.escolaId)||'')}</span></div>`).join('');
  return `<div class="off"><div class="vhead" style="grid-template-columns:repeat(6,minmax(0,1fr))">
    ${[['UPM apoiada','BPEsc'],['Data',dmy(date)],['Horário',v.ini+' às '+v.fim],['Tipo','Ostensivo'],['Circunstância',v.mod],['Especialidade','Escolar']].map(x=>`<div><div class="k">${x[0]}</div><div class="v" style="font-size:14px">${esc(x[1])}</div></div>`).join('')}</div>
    <pre>${esc(v.obs)}</pre><div class="lst">${rows}</div></div>`;
}
const vehText=v=>v.obs+'\n\n'+v.items.map(i=>`${fh(i.ini)} ÀS ${fh(i.fim)}\t${i.tipo==='refeicao'?'REFEIÇÃO':nome(i.escolaId)}`).join('\n');
function vUltimo(){
  if(!S.archive.length)return '<div class="empty">Nenhum RPOE fechado ainda. Gere um roteiro na aba RPOE e use “Fechar RPOE”.</div>';
  const a=S.archive.find(x=>x.id===ui.viewArch)||S.archive[0];
  let h=`<div class="bar">${fld('RPOE fechado',`<select data-f="viewarch" data-fk="va">${S.archive.map((x,i)=>`<option value="${x.id}"${x.id===a.id?' selected':''}>${dmy(x.date)}${i===0?' (último)':''}</option>`).join('')}</select>`)}
   <button class="btn" data-a="copyall" data-id="${a.id}">Copiar tudo</button><span class="sp"></span><span class="mute">Fechado em ${dmy(a.emitidoEm.slice(0,10))} às ${a.emitidoEm.slice(11,16)}</span></div>`;
  return h+a.vehicles.map(v=>official(v,a.date)).join('');
}

function flat(r){
  const out=[];r.vehicles.forEach(v=>v.items.forEach(i=>{if(i.escolaId)out.push({eid:i.escolaId,vtr:v.prefixo,ra:v.ra,ini:i.ini,fim:i.fim})}));return out;
}
function getR(k){return k==='draft'?{label:'Rascunho atual ('+dmy(S.draft.date)+')',date:S.draft.date,vehicles:S.draft.vehicles}:S.archive.find(a=>a.id===k)}
function vComp(){
  const opts=sel=>`<option value="draft"${sel==='draft'?' selected':''}>Rascunho atual (${dmy(S.draft.date)})</option>`+S.archive.map(a=>`<option value="${a.id}"${sel===a.id?' selected':''}>${dmy(a.date)} (fechado)</option>`).join('');
  if(!ui.cmpA)ui.cmpA=S.archive[0]?S.archive[0].id:'draft';
  let h=`<div class="bar">${fld('RPOE A (base)',`<select data-f="cmpa" data-fk="ca">${opts(ui.cmpA)}</select>`)}${fld('RPOE B (comparado)',`<select data-f="cmpb" data-fk="cb">${opts(ui.cmpB)}</select>`)}</div>`;
  const A=getR(ui.cmpA),B=getR(ui.cmpB);
  if(!A||!B||A===B)return h+'<div class="empty">Escolha dois RPOE diferentes para comparar.</div>';
  const fa=flat(A),fb=flat(B),ma=new Map(),mb=new Map();
  fa.forEach(x=>(ma.get(x.eid)||ma.set(x.eid,[]).get(x.eid)).push(x));fb.forEach(x=>(mb.get(x.eid)||mb.set(x.eid,[]).get(x.eid)).push(x));
  const rep=[...mb.keys()].filter(k=>ma.has(k)),nova=[...mb.keys()].filter(k=>!ma.has(k)),saiu=[...ma.keys()].filter(k=>!mb.has(k));
  const rows=rep.map(k=>{const a=ma.get(k),b=mb.get(k);const same=a.some(x=>b.some(y=>ov(x.ini,x.fim,y.ini,y.fim)>=30));return{k,a,b,same}});
  const nSame=rows.filter(r=>r.same).length;
  const t=l=>l.map(x=>`${esc(x.vtr)} ${fh(x.ini)}`).join(', ');
  h+=`<div class="stats">
   <div class="stat"><span class="lbl">Repetidas</span><b>${rep.length}</b></div>
   <div class="stat"><span class="lbl">Mesmo horário</span><b style="color:${nSame?'var(--err)':'inherit'}">${nSame}</b></div>
   <div class="stat"><span class="lbl">Horário diferente</span><b>${rep.length-nSame}</b></div>
   <div class="stat"><span class="lbl">Novas em B</span><b>${nova.length}</b></div>
   <div class="stat"><span class="lbl">Só em A</span><b>${saiu.length}</b></div></div>`;
  h+=rep.length?`<div class="scroll"><table style="min-width:560px"><thead><tr><th>Escola repetida</th><th>A</th><th>B</th><th>Situação</th></tr></thead><tbody>${rows.sort((x,y)=>y.same-x.same).map(r=>`<tr><td><b>${esc(nome(r.k))}</b></td><td class="mono" style="font-family:var(--mono)">${t(r.a)}</td><td class="mono" style="font-family:var(--mono)">${t(r.b)}</td><td>${r.same?chip('err','Mesmo horário'):chip('ok','Horário diferente')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma escola se repetiu entre os dois RPOE.</div>';
  h+=`<div class="cols2"><div class="pcard"><div class="lbl">Novas em B (${nova.length})</div><div class="chips">${nova.map(k=>chip('plain',nome(k))).join('')||'<span class="mute">—</span>'}</div></div>
  <div class="pcard"><div class="lbl">Só em A (${saiu.length})</div><div class="chips">${saiu.map(k=>chip('plain',nome(k))).join('')||'<span class="mute">—</span>'}</div></div></div>`;
  return h;
}

/* ---------- render ---------- */
function render(){
  const k=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.fk;
  const pos=document.activeElement&&document.activeElement.selectionStart;
  document.getElementById('tabs').innerHTML=TABS.map(([id,l])=>`<button class="tab" role="tab" aria-selected="${ui.tab===id}" data-a="tab" data-id="${id}">${l}${id==='escolas'?`<span class="n">${S.schools.length}</span>`:id==='prioritarias'?`<span class="n">${S.schools.filter(e=>e.prioridade>0).length}</span>`:''}</button>`).join('');
  document.getElementById('app').innerHTML={rpoe:vRpoe,escolas:vEscolas,prioritarias:vPrior,ultimo:vUltimo,comparador:vComp}[ui.tab]();
  document.getElementById('undo').disabled=!hist.length;document.getElementById('redo').disabled=!fut.length;
  if(k){const el=document.querySelector(`[data-fk="${k}"]`);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
}

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=b.dataset,vi=+d.vi,ii=+d.ii;
  const veh=S.draft.vehicles[vi];
  switch(a){
   case 'undo':undo();break;case 'redo':redo();break;
   case 'tab':ui.tab=d.id;location.hash=d.id;render();window.scrollTo(0,0);break;
   case 'closecopy':document.getElementById('copyb').hidden=true;break;
   case 'gerar':act(()=>{S.draft=generate(S.draft.date,Math.random,S.archive[0])});toast('Roteiros gerados');break;
   case 'resolver':{let r;act(()=>{r=resolveRep()});toast(r.fixed||r.left?`${r.fixed} repetição(ões) resolvida(s)${r.left?`, ${r.left} sem alternativa`:''}`:'Nenhuma repetição no mesmo horário');break}
   case 'reencaixar':act(()=>{S.draft.vehicles.forEach(v=>{let t=tm(v.ini);v.items.forEach(i=>{const du=i.fim-i.ini;if(i.tipo==='refeicao'&&tm(v.refIni)>t&&tm(v.refIni)-t<=40)t=tm(v.refIni);i.ini=t;i.fim=t+du;t+=du+(i.tipo==='refeicao'?0:+S.settings.gap)})})});toast('Horários reencaixados');break;
   case 'fechar':act(()=>{const r=clone(S.draft);S.archive.unshift({id:'a'+uid(),date:r.date,emitidoEm:new Date().toISOString().slice(0,19),vehicles:r.vehicles});markVisits(r)});toast('RPOE fechado. Última visita das escolas atualizada.');break;
   case 'additem':act(()=>{const last=veh.items.reduce((m,i)=>Math.max(m,i.fim),tm(veh.ini)-S.settings.gap);const s=last+ +S.settings.gap;veh.items.push({id:'i'+uid(),tipo:'visita',ini:s,fim:s+ +S.settings.dur,escolaId:null,origem:'manual'})});break;
   case 'addmeal':act(()=>{const s=tm(veh.refIni);veh.items.push({id:'i'+uid(),tipo:'refeicao',ini:s,fim:s+(+veh.refDur||60),escolaId:null});veh.items.sort((x,y)=>x.ini-y.ini)});break;
   case 'delitem':act(()=>{veh.items.splice(ii,1)});break;
   case 'copyveh':copyText(vehText(veh));break;
   case 'copyall':{const r=S.archive.find(x=>x.id===d.id);copyText(r.vehicles.map(vehText).join('\n\n----------\n\n'));break}
   case 'addcfg':act(()=>{S.cfgVeh.push({id:'v'+uid(),prefixo:'0000',ra:'Taguatinga',mod:'Ordinário',ini:'07:00',fim:'18:30',qtd:8,refIni:'13:30',refDur:60})});break;
   case 'delcfg':act(()=>{S.cfgVeh.splice(+d.i,1)});break;
   case 'more':ui.limit+=200;render();break;
   case 'askdel':ui.confirmDel=d.id;render();break;
   case 'delesc':act(()=>{S.schools=S.schools.filter(e=>e.id!==d.id);ui.confirmDel=null});toast('Escola removida');break;
   case 'copyjson':copyText(document.getElementById('exp').value);break;
   case 'import':{try{const j=JSON.parse(document.getElementById('imp').value);if(!Array.isArray(j.schools))throw 0;act(()=>{S.schools=j.schools.map(e=>({criticos:[],prioridade:0,noite:false,ativa:true,dur:50,origem:'importado',...e,id:e.id||'e'+uid()}));if(j.cfgVeh)S.cfgVeh=j.cfgVeh;if(j.settings)S.settings={...S.settings,...j.settings}});ui.importMsg='Base importada.'}catch(e){ui.importMsg='JSON inválido: cole o conteúdo exportado.';render()}break}
   case 'addprio':{const id=document.getElementById('addp').value;if(id)act(()=>{const e=byId(id);e.prioridade=2;e.criticos=e.criticos||[]});break}
   case 'togcrit':act(()=>{const e=byId(d.id),p=PRESETS.find(x=>x.k===d.k),i=e.criticos.findIndex(c=>c.ini===tm(p.ini)&&c.fim===tm(p.fim));if(i>=0)e.criticos.splice(i,1);else e.criticos.push({k:p.k,ini:tm(p.ini),fim:tm(p.fim)})});break;
   case 'rmcrit':act(()=>{const e=byId(d.id);e.criticos=e.criticos.filter(c=>!(c.ini===+d.ini&&c.fim===+d.fim))});break;
   case 'addcrit':{const i=tm(document.getElementById('ci'+d.id).value),f=tm(document.getElementById('cf'+d.id).value);if(f<=i){toast('O horário final deve ser depois do inicial');break}act(()=>{byId(d.id).criticos.push({k:'Personalizado',ini:i,fim:f})});break}
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target,f=t.dataset.f;if(!f)return;
  const val=t.type==='checkbox'?t.checked:t.value;
  if(f==='q'){ui.q=val;ui.limit=120;render();return}
  if(f==='raf'){ui.ra=val;ui.limit=120;render();return}
  if(f==='cmpa'){ui.cmpA=val;render();return}
  if(f==='cmpb'){ui.cmpB=val;render();return}
  if(f==='viewarch'){ui.viewArch=val;render();return}
  if(f==='newprio')return;
  if(f==='date'){if(val)act(()=>{S.draft.date=val});return}
  if(f==='set')return act(()=>{S.settings[t.dataset.k]=t.dataset.k==='dur'||t.dataset.k==='gap'?+val:val});
  if(f==='cfg')return act(()=>{S.cfgVeh[+t.dataset.i][t.dataset.k]=['qtd','refDur'].includes(t.dataset.k)?+val:val});
  if(f==='obs')return act(()=>{S.draft.vehicles[+t.dataset.vi].obs=val});
  if(f==='esc')return act(()=>{const e=byId(t.dataset.id),k=t.dataset.k;e[k]=['dur','prioridade'].includes(k)?+val:val;if(k==='ultima'&&!val)e.ultima=null;if(k==='prioridade'&&+val>0&&!e.criticos)e.criticos=[];if(k==='nome'&&!val.trim())e.nome='(sem nome)'});
  if(f==='item')return act(()=>{const it=S.draft.vehicles[+t.dataset.vi].items[+t.dataset.ii],k=t.dataset.k;
     if(k==='escolaId'){it.escolaId=val||null;const e=byId(val);if(e){it.fim=it.ini+(+e.dur||50)}}else{const n=tm(val);it[k]=n}});
});
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='newf')return;ev.preventDefault();
  const nm=document.getElementById('n_nome').value.trim().toUpperCase(),ra=document.getElementById('n_ra').value.trim();if(!nm||!ra)return;
  act(()=>{S.schools.unshift({id:'e'+uid(),nome:nm,ra,dur:+document.getElementById('n_dur').value||50,prioridade:+document.getElementById('n_pri').value,criticos:[],noite:document.getElementById('n_noi').value==='1',ativa:true,ultima:null,origem:'manual'})});
  toast('Escola adicionada ao banco');
});
document.addEventListener('keydown',ev=>{
  const tg=ev.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo()}
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='y'){ev.preventDefault();redo()}
});
/* arrastar pela alça */
let drag=null;
document.addEventListener('pointerdown',ev=>{
  const g=ev.target.closest('.grip');if(!g)return;
  const row=g.closest('.row'),list=row.parentElement;
  drag={row,list,vi:+list.dataset.vi,before:[...list.children].map(r=>r.dataset.id).join()};
  row.classList.add('dragging');try{g.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault();
});
document.addEventListener('pointermove',ev=>{
  if(!drag)return;
  const el=document.elementFromPoint(ev.clientX,ev.clientY),r=el&&el.closest&&el.closest('.row');
  if(r&&r!==drag.row&&r.parentElement===drag.list){const b=r.getBoundingClientRect();drag.list.insertBefore(drag.row,ev.clientY>b.top+b.height/2?r.nextSibling:r)}
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;d.row.classList.remove('dragging');
  const ids=[...d.list.children].map(r=>r.dataset.id);
  if(ids.join()===d.before){return}
  act(()=>{const v=S.draft.vehicles[d.vi],slots=v.items.map(i=>[i.ini,i.fim-i.ini]),map=new Map(v.items.map(i=>[i.id,i]));
    v.items=ids.map((id,p)=>{const it=map.get(id),du=it.fim-it.ini;it.ini=slots[p][0];it.fim=it.ini+du;return it})});
  toast('Ordem alterada. Use “Reencaixar horários” se houver sobreposição.');
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==ui.tab){ui.tab=h;render()}});

init();render();
})();
</script>

</body></html>
